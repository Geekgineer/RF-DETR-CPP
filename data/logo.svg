<svg width="1280" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#070c16"/>
      <stop offset="100%" stop-color="#0a1222"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="400" fill="url(#accentV)"/>

  <!-- ─────────────── LEFT PANEL ─────────────── -->

  <!-- Wordmark: RF-DETR -->
  <text x="68" y="176"
        font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif"
        font-size="88" font-weight="800" letter-spacing="-4"
        fill="#f1f5f9">RF-DETR</text>

  <!-- Qualifier: — CPP (own line, smaller, orange) -->
  <text x="72" y="232"
        font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif"
        font-size="46" font-weight="700" letter-spacing="2"
        fill="#f97316">&#8212; CPP</text>

  <!-- Hairline rule -->
  <line x1="68" y1="252" x2="594" y2="252" stroke="#162540" stroke-width="1"/>

  <!-- Tagline: uppercase spaced -->
  <text x="70" y="280"
        font-family="'Segoe UI', system-ui, Arial, sans-serif"
        font-size="13" font-weight="400" letter-spacing="3.5"
        fill="#3a4f6a">C++  ONNX  RUNTIME  INFERENCE  ENGINE</text>

  <!-- Backend / platform line -->
  <text x="70" y="306"
        font-family="'Segoe UI', system-ui, Arial, sans-serif"
        font-size="12.5" letter-spacing="0.3"
        fill="#1f3355">CPU · CUDA · TensorRT · Linux · Windows · macOS</text>

  <!-- Task chips -->

  <!-- detect -->
  <rect x="68" y="330" width="110" height="28" rx="14"
        fill="none" stroke="#f97316" stroke-width="1.4"/>
  <circle cx="91" cy="344" r="3.5" fill="#f97316"/>
  <text x="142" y="349" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="12" font-weight="500" letter-spacing="0.4" fill="#f97316">Detection</text>

  <!-- segment -->
  <rect x="192" y="330" width="128" height="28" rx="14"
        fill="none" stroke="#3b82f6" stroke-width="1.4"/>
  <circle cx="215" cy="344" r="3.5" fill="#3b82f6"/>
  <text x="272" y="349" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="12" font-weight="500" letter-spacing="0.4" fill="#3b82f6">Segmentation</text>

  <!-- keypoints -->
  <rect x="334" y="330" width="110" height="28" rx="14"
        fill="none" stroke="#8b5cf6" stroke-width="1.4"/>
  <circle cx="357" cy="344" r="3.5" fill="#8b5cf6"/>
  <text x="411" y="349" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="12" font-weight="500" letter-spacing="0.4" fill="#8b5cf6">Keypoints</text>

  <!-- ─────────────── SEPARATOR ─────────────── -->
  <line x1="640" y1="14" x2="640" y2="386" stroke="#162540" stroke-width="1"/>

  <!-- ─────────────── RIGHT PANEL: Inference Viewport ─────────────── -->

  <!-- Panel background -->
  <rect x="656" y="22" width="610" height="356" rx="4"
        fill="#05090f" stroke="#112035" stroke-width="1"/>

  <!-- Viewport label (ghost text, top-left) -->
  <text x="672" y="40"
        font-family="'Courier New', Courier, monospace"
        font-size="9.5" letter-spacing="1.5" fill="#0f2040">INFERENCE VIEW</text>

  <!-- ── SEGMENTATION: body ellipse (blue dashed, semi-transparent) ── -->
  <ellipse cx="960" cy="216" rx="90" ry="118"
           fill="#1a3f7a" fill-opacity="0.18"/>
  <ellipse cx="960" cy="216" rx="90" ry="118"
           fill="none" stroke="#3b82f6" stroke-width="1.4"
           stroke-dasharray="6 4" opacity="0.5"/>

  <!-- ── DETECTION: Bounding box corner marks ── -->

  <!-- Glow layer (wide, low opacity) -->
  <line x1="832" y1="58"  x2="882" y2="58"   stroke="#f97316" stroke-width="9" opacity="0.06" stroke-linecap="round"/>
  <line x1="832" y1="58"  x2="832" y2="108"  stroke="#f97316" stroke-width="9" opacity="0.06" stroke-linecap="round"/>
  <line x1="1088" y1="58"  x2="1038" y2="58"  stroke="#f97316" stroke-width="9" opacity="0.06" stroke-linecap="round"/>
  <line x1="1088" y1="58"  x2="1088" y2="108" stroke="#f97316" stroke-width="9" opacity="0.06" stroke-linecap="round"/>
  <line x1="832" y1="362" x2="882" y2="362"  stroke="#f97316" stroke-width="9" opacity="0.06" stroke-linecap="round"/>
  <line x1="832" y1="362" x2="832" y2="312"  stroke="#f97316" stroke-width="9" opacity="0.06" stroke-linecap="round"/>
  <line x1="1088" y1="362" x2="1038" y2="362" stroke="#f97316" stroke-width="9" opacity="0.06" stroke-linecap="round"/>
  <line x1="1088" y1="362" x2="1088" y2="312" stroke="#f97316" stroke-width="9" opacity="0.06" stroke-linecap="round"/>

  <!-- Crisp corner marks -->
  <line x1="832" y1="58"  x2="882" y2="58"   stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="832" y1="58"  x2="832" y2="108"  stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="1088" y1="58"  x2="1038" y2="58"  stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="1088" y1="58"  x2="1088" y2="108" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="832" y1="362" x2="882" y2="362"  stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="832" y1="362" x2="832" y2="312"  stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="1088" y1="362" x2="1038" y2="362" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="1088" y1="362" x2="1088" y2="312" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Box faint outline -->
  <rect x="832" y="58" width="256" height="304" rx="2"
        fill="none" stroke="#f97316" stroke-width="0.7" opacity="0.10"/>

  <!-- Detection confidence label -->
  <rect x="832" y="32" width="158" height="28" rx="14" fill="#f97316"/>
  <text x="911" y="50" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="13" font-weight="700" letter-spacing="0.2" fill="#fff">person  0.941</text>

  <!-- ── KEYPOINTS: person skeleton (violet) ── -->

  <!-- Head -->
  <circle cx="960" cy="92" r="20" fill="#7c3aed" opacity="0.09"/>
  <circle cx="960" cy="92" r="14" fill="none" stroke="#8b5cf6" stroke-width="2.2" opacity="0.88"/>
  <circle cx="960" cy="92" r="4.5" fill="#a78bfa" opacity="0.95"/>

  <!-- Neck -->
  <circle cx="960" cy="128" r="4" fill="#a78bfa" opacity="0.85"/>

  <!-- Shoulders -->
  <circle cx="910" cy="150" r="5" fill="#a78bfa" opacity="0.9"/>
  <circle cx="1010" cy="150" r="5" fill="#a78bfa" opacity="0.9"/>
  <line x1="960" y1="128" x2="910" y2="150" stroke="#8b5cf6" stroke-width="2.2" opacity="0.68"/>
  <line x1="960" y1="128" x2="1010" y2="150" stroke="#8b5cf6" stroke-width="2.2" opacity="0.68"/>

  <!-- Elbows -->
  <circle cx="882" cy="198" r="5" fill="#a78bfa" opacity="0.9"/>
  <circle cx="1038" cy="198" r="5" fill="#a78bfa" opacity="0.9"/>
  <line x1="910" y1="150" x2="882" y2="198" stroke="#8b5cf6" stroke-width="2.2" opacity="0.68"/>
  <line x1="1010" y1="150" x2="1038" y2="198" stroke="#8b5cf6" stroke-width="2.2" opacity="0.68"/>

  <!-- Wrists -->
  <circle cx="870" cy="242" r="5" fill="#a78bfa" opacity="0.9"/>
  <circle cx="1050" cy="242" r="5" fill="#a78bfa" opacity="0.9"/>
  <line x1="882" y1="198" x2="870" y2="242" stroke="#8b5cf6" stroke-width="2.2" opacity="0.68"/>
  <line x1="1038" y1="198" x2="1050" y2="242" stroke="#8b5cf6" stroke-width="2.2" opacity="0.68"/>

  <!-- Spine -->
  <line x1="960" y1="128" x2="960" y2="242" stroke="#8b5cf6" stroke-width="2" opacity="0.50"/>

  <!-- Hips -->
  <circle cx="934" cy="242" r="5" fill="#a78bfa" opacity="0.9"/>
  <circle cx="986" cy="242" r="5" fill="#a78bfa" opacity="0.9"/>
  <line x1="934" y1="242" x2="986" y2="242" stroke="#8b5cf6" stroke-width="2" opacity="0.50"/>

  <!-- Knees -->
  <circle cx="924" cy="292" r="5" fill="#a78bfa" opacity="0.9"/>
  <circle cx="996" cy="292" r="5" fill="#a78bfa" opacity="0.9"/>
  <line x1="934" y1="242" x2="924" y2="292" stroke="#8b5cf6" stroke-width="2.2" opacity="0.68"/>
  <line x1="986" y1="242" x2="996" y2="292" stroke="#8b5cf6" stroke-width="2.2" opacity="0.68"/>

  <!-- Ankles -->
  <circle cx="916" cy="340" r="5" fill="#a78bfa" opacity="0.9"/>
  <circle cx="1004" cy="340" r="5" fill="#a78bfa" opacity="0.9"/>
  <line x1="924" y1="292" x2="916" y2="340" stroke="#8b5cf6" stroke-width="2.2" opacity="0.68"/>
  <line x1="996" y1="292" x2="1004" y2="340" stroke="#8b5cf6" stroke-width="2.2" opacity="0.68"/>

  <!-- Bottom accent bar -->
  <rect x="0" y="397" width="1280" height="3" fill="url(#accentV)"/>
</svg>
